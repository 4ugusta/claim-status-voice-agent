[project]
name = "claim-status-voice-agent"
version = "0.1.0"
description = "An outbound voice agent that calls an insurer's helpline, works through its phone menu and asks for a claim's status."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents[silero]~=1.8.8",
    "livekit-api>=1.1",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6"]
# scripts/render_call.py: a finished call as a video
demo = ["pillow>=10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claimcall"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
